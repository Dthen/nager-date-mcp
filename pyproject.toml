[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nager-date-mcp"
version = "0.3.0"
description = "MCP server for public holidays in 200+ countries via the Nager.Date API"
readme = "README.md"
license = {text = "0BSD"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
